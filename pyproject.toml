[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graft-ql"
version = "0.1.0-preview"
description = "Code insight engine — queryable intelligence over source code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["code-analysis", "static-analysis", "developer-tools"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "lark>=1.1",
    "sqlalchemy>=2.0",
    "fastapi>=0.100",
    "uvicorn",
    "typer>=0.9",
    "rich",
    "tree-sitter>=0.20",
    "tree-sitter-python>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "allure-pytest>=2.13",
]
demo = [
    "asciinema>=2.4",
    "agg>=1.8",
]

[project.scripts]
graft = "cli.graft:app"

[tool.setuptools]
packages = [
    "cli",
    "code_indexer",
    "code_indexer.languages",
    "graft_parser",
    "graft_engine",
    "graft_engine.compiler",
    "graft_engine.entity_registry",
    "graft_server",
]

[tool.setuptools.package-dir]
"" = "."
"graft_parser" = "parser/graft_parser"
"graft_engine" = "engine/graft_engine"
"graft_server" = "server/graft_server"

[tool.pytest.ini_options]
testpaths      = ["tests"]
python_files   = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts        = "-v --tb=short"
markers = [
    "integration: full pipeline tests (index -> query -> result)",
    "smoke:       single happy-path pipeline run",
    "server:      HTTP server endpoint tests",
]

[tool.coverage.run]
source = ["code_indexer", "parser/graft_parser", "engine/graft_engine"]
omit   = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
